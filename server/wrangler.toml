name = "gaming-zone-monopolio"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
# Tiempos en segundos (se pueden cambiar sin tocar el código)
TURN_SECONDS = "240"
TRADE_SECONDS = "60"
# Orígenes de la web que pueden usar el servidor, separados por coma. Vacío = cualquiera (solo para desarrollo).
ALLOWED_ORIGINS = "https://monopolio-del-janeo.gamingzone.workers.dev,http://localhost:5173"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
